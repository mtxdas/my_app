name: preu
description: "PREU - Remote Desktop Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI-এর জন্য আইকন লাইব্রেরি
  cupertino_icons: ^1.0.6

  # রিমোট ভিডিও ও অডিও স্ট্রিম করার জন্য (WebRTC)
  flutter_webrtc: ^0.9.40

  # রিয়েলটাইম সিগন্যালিং ও কমান্ড পাঠানোর জন্য (Socket.IO)
  socket_io_client: ^2.0.3+1

  # অ্যান্ড্রয়েড স্ক্রিন ক্যাপচার ও ব্যাকগ্রাউন্ড সার্ভিস চালু রাখার জন্য
  flutter_foreground_task: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
